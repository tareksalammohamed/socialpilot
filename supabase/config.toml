# OAuth callbacks are reached by the platform's browser redirect and therefore
# do not carry the user's Supabase Authorization header. Authentication is
# provided by the short-lived, single-use social_oauth_states row in the
# callback implementation.
[functions.social-oauth-callback]
verify_jwt = false

# Endpoints below are called by systems that cannot send a Supabase user JWT
# (pg_cron/pg_net, Meta/LinkedIn webhooks). Each authenticates the caller
# itself inside the function (Vault cron secret / HMAC signature), so
# verify_jwt must stay false. Without these entries a CLI redeploy from git
# would default them to verify_jwt=true and reject every cron/webhook call.
[functions.scheduler-tick]
verify_jwt = false

[functions.inbox-webhook]
verify_jwt = false

[functions.social-linkedin-webhook]
verify_jwt = false

[functions.telegram-inbox-webhook]
verify_jwt = false


# Evolution sends provider webhooks without a Supabase user JWT.
# The function validates a unique per-instance x-socialpilot-secret header.
[functions.whatsapp-evolution-webhook]
verify_jwt = false


# Internal background worker; it accepts only the exact Supabase service-role token.
[functions.inbox-auto-reply]
verify_jwt = false

# WAHA and WPPConnect send provider webhooks without a Supabase user JWT.
# WAHA validates HMAC SHA-512 + a per-session secret header.
# WPPConnect validates a per-session secret in the webhook callback URL.
[functions.whatsapp-waha-webhook]
verify_jwt = false

[functions.whatsapp-wppconnect-webhook]
verify_jwt = false

# Legacy callback router forwards raw payloads to the authenticated provider handlers.
[functions.whatsapp-provider-webhook]
verify_jwt = false

# Internal durable content worker authenticates the Vault cron secret or exact
# service-role key; it never accepts an anonymous or ordinary user request.
[functions.assistant-worker]
verify_jwt = false
