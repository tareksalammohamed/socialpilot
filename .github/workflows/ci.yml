name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  whatsapp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Check WhatsApp Edge Functions
        working-directory: supabase
        run: deno task check:whatsapp
      - name: Test WhatsApp lifecycle and webhooks
        working-directory: supabase
        run: deno task test:whatsapp

  whatsapp-database:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: whatsapp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: whatsapp_test
    steps:
      - uses: actions/checkout@v5
      - name: Verify real lifecycle transactions, leases and permissions
        run: >-
          psql -v ON_ERROR_STOP=1
          -f supabase/tests/whatsapp_schema_fixture.sql
          -f supabase/migrations/20261003000816_whatsapp_session_lifecycle.sql
          -f supabase/tests/whatsapp_lifecycle.sql
